# =============================================================================
# dm-backup — configurazione di progetto (TEMPLATE)
# =============================================================================
# Copia questo file in "config.yaml" e adattalo al progetto.
# config.yaml NON viene versionato (vedi .gitignore): contiene i dati reali.
# =============================================================================

# --- Crediti: finiscono nell'intestazione del log giornaliero ---
project:
  film: "NOME DEL FILM"
  prod: "PRODUZIONE"
  regia: "REGIA"
  dop: "DIRETTORE DELLA FOTOGRAFIA"
  dit: "DIT"
  dmanager: "DATA MANAGER"

# --- Percorsi principali ---
paths:
  # Radice del film: qui il comando "init" (inizio film) crea la struttura
  # elencata in project_folders (una volta sola).
  project_root: "/Users/dit/Desktop/NOME_FILM"
  # Cartella che contiene le giornate (DAYxxx_yyyyMMdd), i REPORT e le sorgenti.
  # Tipicamente una delle project_folders create da init.
  base_work: "/Users/dit/Desktop/NOME_FILM/DAILY FILES"
  # Drive condiviso dove finiscono le still.
  drive: "/Volumes/DRIVE_CONDIVISO"
  # Sottocartella del drive dedicata alle still (se vuota, si usa <drive>/<DAY>).
  destination_still: "/Volumes/DRIVE_CONDIVISO/STILLS"

# --- Dischi ---
disks:
  # Nomi dei volumi di backup montati in /Volumes. La cartella DAY deve GIÀ
  # esistere su ciascuno (contiene i dailies video/audio); i documenti ci
  # vengono aggiunti dentro.
  backup_disks:
    - "ODC_BACKUP_01"
    - "ODC_BACKUP_02"
  # Prefisso del disco "spola" (rilevato automaticamente in /Volumes; se più
  # di uno, viene chiesto quale usare).
  disc_spola: "ODC_SPOLA"

# --- Sorgenti ---
sources:
  # Cartelle (dentro base_work) copiate dal comando "files".
  # ESTENDIBILE: aggiungi/rimuovi voci senza toccare il codice.
  folders:
    - "DRP"
    - "ALE"
  # Cartella sorgente delle still (usata da "still" e per l'autodetect del DAY).
  still: "/Users/dit/Desktop/NOME_FILM/STILL_LAB"

# --- Log ---
log:
  folder_name: "SCRIPT LOGS"

# --- Struttura del film creata dal comando "init" (una volta, a inizio film) ---
# Cartelle create dentro paths.project_root. È la struttura usata per tutta la
# produzione: qui dentro vivono base_work, le sorgenti, i log, ecc.
project_folders:
  - "DAILY FILES"     # -> base_work
  - "STILL_LAB"
  - "SCRIPT LOGS"
  - "SETTINGS"

# --- Rinomina still per DaVinci Resolve ---
# Scrivi qui, in parole semplici, cosa vuoi nel nome del file: l'eseguibile
# costruisce il pattern %{...} da incollare in Resolve (Deliver > Custom name).
# Il token che porta il DAY viene AGGIUNTO IN CODA automaticamente: NON elencarlo.
#
# Alias disponibili: scena, clip, timeline, reel, shot, take, camera, roll, program
# Esempio: fields [scena, clip] con day_token "timeline" ->
#          SC%{Scene}_%{Clip Name}_%{Timeline Name}
still_rename:
  prefix: "SC"
  fields:
    - "scena"
    - "clip"
  separator: "_"
  day_token: "timeline"   # token che contiene "DAY###" (default: timeline)
