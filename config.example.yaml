# =============================================================================
# dm-backup — configurazione di progetto (TEMPLATE)
# =============================================================================
# Copia questo file in "config.yaml" e adattalo al progetto.
# config.yaml NON viene versionato (vedi .gitignore): contiene i dati reali.
# I percorsi qui sotto seguono la struttura reale (TODAY_FILES / DAILY_FILES).
# =============================================================================

# --- Crediti: finiscono nell'intestazione del log giornaliero ---
project:
  film: "NOME_FILM"
  prod: "PRODUZIONE"
  regia: "REGIA"
  dop: "DIRETTORE DELLA FOTOGRAFIA"
  dit: "DIT"
  dmanager: "DATA MANAGER"

# --- Percorsi principali ---
paths:
  # Radice del film: qui "init" crea la struttura (project_folders).
  project_root: "/Users/utente/Desktop/NOME_FILM"
  # Cartella di lavoro della giornata (still, ALE, DRP, ...).
  today_files: "/Users/utente/Desktop/NOME_FILM/TODAY_FILES"
  # Dove Silverstack crea il DAY master (= nome bin) e la cartella spola.
  daily_files: "/Users/utente/Desktop/NOME_FILM/DAILY_FILES"
  # Dove salvare i log (default: <project_root>/LOGS se vuoto).
  log_folder: "/Users/utente/Desktop/NOME_FILM/LOGS"
  # Destinazioni su Google Drive (si appende il nome del DAY, es. DAY023_20260525).
  drive_reports: "/Users/utente/Library/CloudStorage/GoogleDrive-.../Il mio Drive/REPORTS"
  drive_stills: "/Users/utente/Library/CloudStorage/GoogleDrive-.../Il mio Drive/NOME_FILM STILLs"

# --- Struttura interna (nomi cartelle, relativi a today_files/daily_files) ---
structure:
  reports_subfolder: "03_REPORTS"     # sottocartella report dentro il DAY master
  still_source: "05_STILL"            # sorgente still (in TODAY_FILES)
  # Cartelle copiate da "files" (in TODAY_FILES) dentro il DAY master.
  # ESTENDIBILE: aggiungi/rimuovi voci senza toccare il codice.
  files_folders:
    - "04_DRP"
    - "06_STILL_LAB"
    - "05_STILL"

# --- Spola (il "shuttle" che va in post) ---
spola:
  # Prefisso del volume spola montato in /Volumes (es. rileva NOME_SHUTTLE13).
  prefix: "NOME_SHUTTLE"
  # I report della spola stanno in daily_files/<spola>/<qui>.
  reports_subfolder: "03_REPORTS"

# --- Dischi di destinazione ---
disks:
  # Volumi montati in /Volumes che ricevono sempre il DAY master.
  fixed_disks:
    - "NOME_MASTER01"
    - "NOME_TEMP01"
  # Se true, anche la spola rilevata riceve la copia (come 3° disco).
  include_spola: true

# --- Nome della cartella DAY ---
# Il numero DAY si legge dai nomi dei jpg delle still; la data è (adesso - N ore).
# Alza il valore se le notturne finiscono dopo mezzanotte: 8 copre le riprese
# tardive senza rischi (non lanci mai il backup nelle prime ore dello stesso
# giorno di calendario). 6 = come lo script originale, 10 = ancora sicuro.
day_hour_offset: 8

# --- Modalità still ---
still:
  mode: minutes        # "minutes" = chiede gli ultimi N min | "drx" = copia le still con .drx omonimo
  default_minutes: 5     # default del prompt "ultimi N minuti"
  delete_drx: true       # elimina i .drx dalla sorgente still prima di copiare
  extension: ".jpg"      # copia solo i file con questa estensione

# --- Sicurezza (migliorie rispetto all'originale) ---
safety:
  verify_checksum: true  # svuota TODAY solo se i checksum tornano su tutti i dischi
  write_mhl: true        # genera un manifest MHL per ogni copia
  check_space: true      # controlla lo spazio libero prima di copiare

# --- Pulizia ---
cleanup:
  spola_folder: true     # rm -rf di DAILY_FILES/<spola> a fine copia (come originale)

# --- Struttura del film creata da "init" (una volta, a inizio film) ---
# Cartelle create dentro paths.project_root (sono ammessi percorsi annidati).
project_folders:
  - "TODAY_FILES/04_DRP"
  - "TODAY_FILES/05_STILL"
  - "TODAY_FILES/06_STILL_LAB"
  - "DAILY_FILES"
  - "LOGS"

# --- Email di fine giornata (bozza in Mail.app, NON inviata da sola) ---
# A fine "files" prepara una mail già pronta con i report allegati: la controlli
# e premi Invia tu. Segnaposto usabili in oggetto/testo:
#   {DAY} -> DAY023_20260525     {DATA} -> 20260525     {FILM} -> nome del film
email:
  invia_email: "n"                 # y = prepara la bozza, n = nessuna email
  mailinglist: "produzione@example.com, montaggio@example.com"
  oggetto: "Report di giornata {DAY}"
  testo: |
    Salve,
    invio i report della giornata di oggi, {DAY}.
    Ciao.
  allega_report_giornata: "y"      # i report di Silverstack (03_REPORTS)
  allega_report_pdf: "y"           # il report riepilogativo di dm-backup

# --- Rinomina still per DaVinci Resolve ---
# Scrivi in parole semplici cosa vuoi nel nome: l'eseguibile costruisce il
# pattern %{...} da incollare in Resolve. Il token col DAY va in coda da solo.
# Alias: scena, clip, timeline, reel, shot, take, camera, roll, program
still_rename:
  prefix: "SC"
  fields:
    - "scena"
    - "clip"
  separator: "_"
  day_token: "timeline"
